name: Build LineCurativos Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Instalar Gradle 9.5.0
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.5.0-bin.zip
          unzip -q gradle-9.5.0-bin.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-9.5.0/bin" >> "$GITHUB_PATH"

      - name: Gerar APK
        working-directory: android/LineCurativosAndroid
        run: gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: LineCurativos-debug-apk
          path: android/LineCurativosAndroid/app/build/outputs/apk/debug/app-debug.apk
